trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: 'waymo-scenario-explorer'
  dockerfilePath: '$(Build.SourcesDirectory)/app.Dockerfile'
  containerRegistry: 'waymoregistry.azurecr.io'
  imageTag: '$(Build.BuildId)'

steps:
  - checkout: self

  - task: AzureCLI@2
    displayName: 'Build and push Streamlit image'
    inputs:
      azureSubscription: 'waymo-rg-sc'
      scriptType: 'bash'
      scriptLocation: 'inlineScript'
      inlineScript: |
        set -e

        echo "Logging into Azure Container Registry..."
        az acr login --name waymoregistry

        echo "Building Docker image..."
        docker build \
          -f "$(dockerfilePath)" \
          -t "$(containerRegistry)/$(imageRepository):$(imageTag)" \
          -t "$(containerRegistry)/$(imageRepository):latest" \
          "$(Build.SourcesDirectory)"

        echo "Pushing image with build tag..."
        docker push "$(containerRegistry)/$(imageRepository):$(imageTag)"

        echo "Pushing latest..."
        docker push "$(containerRegistry)/$(imageRepository):latest"

        echo "Done."
