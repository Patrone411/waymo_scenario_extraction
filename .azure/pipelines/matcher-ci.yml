trigger:
  branches:
    include:
      - main
  paths:
    include:
      - scenario_extraction/run_matching.py
      - scenario_extraction/matcher_utils.py
      - scenario_extraction/azure_results_writer.py
      - scenario_extraction/matcher_utils.py
      - scenario_extraction/parquet_source.py
      - scenario_extraction/scenario_matching/**
      - scenario_extraction/osc2_parser/**
      - scenario_extraction/requirements_matcher.txt
      - external/**
      - docker/matcher.Dockerfile
      - tests/matcher/**
      - .azure/pipelines/matcher-ci.yml

variables:
  - group: matcher-ci-secrets   # enthaelt AZURE_STORAGE_ACCOUNT, AZURE_STORAGE_KEY
  - name: ACR_NAME
    value: waymoregistry
  - name: IMAGE_NAME
    value: scenario-matcher
  - name: DOCKERFILE_PATH
    value: docker/matcher.Dockerfile

stages:

- stage: Test
  displayName: Unit & Integration Tests
  jobs:
  - job: RunTests
    displayName: pytest
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      submodules: true
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'

    - script: |
        pip install --upgrade pip
        pip install -r scenario_extraction/requirements_matcher.txt
        pip install pytest pytest-cov azure-storage-blob
      displayName: Install dependencies

    - script: |
        PYTHONPATH=./scenario_extraction python -m pytest tests/matcher/ \
          -v \
          --tb=short \
          --junitxml=test-results.xml \
          --cov=run_matching \
          --cov=azure_results_writer \
          --cov=parquet_source \
          --cov=matcher_utils \
          --cov=osc2_parser \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing
      displayName: Run matcher tests (Parser, Source-Read, Matching, Full-Shard mit Azure-Upload)
      env:
        AZURE_STORAGE_ACCOUNT: $(AZURE_STORAGE_ACCOUNT)
        AZURE_STORAGE_KEY: $(AZURE_STORAGE_KEY)

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: test-results.xml
        testRunTitle: Matcher Tests

    - task: PublishCodeCoverageResults@1
      condition: always()
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: coverage.xml

- stage: Build
  displayName: Build & Push to ACR
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: BuildAndPush
    displayName: Docker Build & Push

    pool:
      vmImage: ubuntu-latest

    steps:
    - checkout: self
      submodules: true

    - task: AzureCLI@2
      displayName: Build and Push Image
      inputs:
        azureSubscription: 'waymo-rg-sc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "Logging into Azure Container Registry..."
          az acr login --name $(ACR_NAME)

          IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)"

          echo "Building image (erster Push, Repository wird bei Bedarf automatisch angelegt):"
          echo "$IMAGE"

          docker build \
            -f "$(DOCKERFILE_PATH)" \
            -t "$IMAGE" \
            "$(Build.SourcesDirectory)"

          echo "Pushing image (nur BuildId-Tag, 'latest' erst nach IntegrationTest):"
          docker push "$IMAGE"

          echo "Successfully pushed:"
          echo "$IMAGE"

- stage: IntegrationTest
  displayName: Integration Test (Shard 0, echtes Image)
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TestShard
    displayName: Run matcher container against Azure Blob (Shard 0)
    pool:
      vmImage: ubuntu-latest
    steps:

    - task: AzureCLI@2
      displayName: ACR Login
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: az acr login --name $(ACR_NAME)

    - task: AzureCLI@2
      displayName: Run Matcher Container (Shard 0)
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          docker run --rm \
            -e AZURE_MODE=true \
            -e AZURE_STORAGE_ACCOUNT=$(AZURE_STORAGE_ACCOUNT) \
            -e AZURE_STORAGE_KEY=$(AZURE_STORAGE_KEY) \
            -e AZURE_INPUT_CONTAINER=parquets \
            -e AZURE_RESULTS_CONTAINER=results \
            -e BASE_PREFIX=parquet/matcher_ci_test/00000 \
            -e RUN_ID=matcher-ci-$(Build.BuildId) \
            -e RESULTS_PREFIX=results/matcher_ci_test \
            $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)

    - task: AzureCLI@2
      displayName: Verify Output on Azure Blob
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          COUNT=$(az storage blob list \
            --container-name results \
            --account-name $(AZURE_STORAGE_ACCOUNT) \
            --account-key $(AZURE_STORAGE_KEY) \
            --prefix "results/matcher_ci_test/match_hits/" \
            --query "length(@)" \
            --output tsv)

          echo "match_hits Parquet-Dateien: $COUNT"

          if [ "$COUNT" -lt "1" ]; then
            echo "ERROR: keine match_hits gefunden"
            exit 1
          fi

          echo "Integration Test bestanden: $COUNT Datei(en) in match_hits"

    - task: AzureCLI@2
      displayName: Promote 'latest' Tag
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e
          az acr login --name $(ACR_NAME)
          IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)"
          docker pull "$IMAGE"
          docker tag "$IMAGE" "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest"
          docker push "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest"

