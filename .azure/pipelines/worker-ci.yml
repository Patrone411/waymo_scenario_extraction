trigger:
  branches:
    include:
      - main
  paths:
    include:
      - worker.py
      - worker_utils.py
      - docker/worker.Dockerfile
      - requirements_worker.txt
      - feature_extraction/**
      - external/**

variables:
  ACR_NAME:        waymoregistry
  IMAGE_NAME:      parquet-worker
  DOCKERFILE_PATH: docker/worker.Dockerfile

stages:

- stage: Test
  displayName: Unit Tests
  jobs:
  - job: RunTests
    displayName: pytest
    pool:
      vmImage: ubuntu-latest
    steps:

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '3.10'

    - script: |
        pip install --upgrade pip
        pip install -r requirements_worker.txt
        pip install pytest pytest-cov
      displayName: Install dependencies

    - script: |
        pytest tests/test_worker.py \
          -v \
          --tb=short \
          --junitxml=test-results.xml \
          --cov=worker \
          --cov-report=xml:coverage.xml \
          --cov-report=term-missing
      displayName: Run unit tests

    - task: PublishTestResults@2
      condition: always()
      inputs:
        testResultsFormat: JUnit
        testResultsFiles: test-results.xml
        testRunTitle: Worker Unit Tests

    - task: PublishCodeCoverageResults@1
      condition: always()
      inputs:
        codeCoverageTool: Cobertura
        summaryFileLocation: coverage.xml

- stage: Build
  displayName: Build & Push to ACR
  dependsOn: Test
  condition: succeeded()
  jobs:

  - job: BuildAndPush
    displayName: Docker Build & Push
    pool:
      vmImage: ubuntu-latest

    steps:
    - task: AzureCLI@2
      displayName: Build and Push Image
      inputs:
        azureSubscription: 'waymo-rg-sc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "Logging into Azure Container Registry..."
          az acr login --name $(ACR_NAME)

          echo "Building Docker image..."
          docker build \
            -f "$(DOCKERFILE_PATH)" \
            -t "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)" \
            -t "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest" \
            "$(Build.SourcesDirectory)"

          echo "Pushing image with build tag..."
          docker push "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)"

          echo "Pushing latest..."
          docker push "$(ACR_NAME).azurecr.io/$(IMAGE_NAME):latest"

          echo "Done."

- stage: IntegrationTest
  displayName: Integration Test (Shard 0)
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: TestShard
    displayName: Run worker against Azure Blob (Shard 0)
    pool:
      vmImage: ubuntu-latest
    steps:

    - task: AzureCLI@2
      displayName: ACR Login
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: az acr login --name $(ACR_NAME)

    - task: AzureCLI@2
      displayName: Run Worker Container (Shard 0)
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          STORAGE_KEY=$(az storage account keys list \
            --account-name waymostorage \
            --resource-group waymo-rg \
            --query [0].value \
            --output tsv)

          docker run --rm \
            -e AZURE_STORAGE_ACCOUNT=waymostorage \
            -e AZURE_STORAGE_KEY=$STORAGE_KEY \
            -e AZURE_INPUT_CONTAINER=tfrecords \
            -e AZURE_OUTPUT_CONTAINER=parquets \
            -e AZURE_PREFIX=parquet/ci-test \
            -e SHARD_INDEX=0 \
            -e TOTAL_SHARDS=50 \
            $(ACR_NAME).azurecr.io/$(IMAGE_NAME):$(Build.BuildId)

    - task: AzureCLI@2
      displayName: Verify Output on Azure Blob
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          COUNT=$(az storage blob list \
            --container-name parquets \
            --account-name waymostorage \
            --prefix "parquet/ci-test/00000/scenes/" \
            --query "length(@)" \
            --output tsv)

          echo "Parquet files written: $COUNT"

          if [ "$COUNT" -lt "1" ]; then
            echo "ERROR: keine Parquet-Dateien gefunden"
            exit 1
          fi

          echo "Integration Test bestanden: $COUNT Scenes geschrieben"

    - task: AzureCLI@2
      displayName: Cleanup CI Test Output
      condition: always()
      inputs:
        azureSubscription: waymo-rg-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az storage blob delete-batch \
            --source parquets \
            --account-name waymostorage \
            --pattern "parquet/ci-test/*"