trigger: none

parameters:
- name: buildId
  displayName: 'Build ID to deploy'
  type: string

variables:
  ACR_NAME: waymoregistry
  IMAGE_NAME: parquet-worker
  AKS_RESOURCE_GROUP: waymo-rg
  AKS_CLUSTER_NAME: waymo-aks

stages:

- stage: Deploy
  displayName: Deploy Worker to AKS

  jobs:
  - job: DeployWorker
    displayName: Deploy Worker
    pool:
      vmImage: ubuntu-latest

    steps:

    - task: AzureCLI@2
      displayName: Get AKS credentials
      inputs:
        azureSubscription: 'waymo-rg-sc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          echo "Getting AKS credentials..."

          az aks get-credentials \
            --resource-group "$(AKS_RESOURCE_GROUP)" \
            --name "$(AKS_CLUSTER_NAME)" \
            --overwrite-existing

          echo "Connected to AKS:"
          kubectl get nodes

    - task: AzureCLI@2
      displayName: Deploy Worker
      inputs:
        azureSubscription: 'waymo-rg-sc'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -e

          IMAGE="$(ACR_NAME).azurecr.io/$(IMAGE_NAME):${{ parameters.buildId }}"

          echo "Deploying image:"
          echo "$IMAGE"

          kubectl create job parquet-worker-${{ parameters.buildId }} \
            --image="$IMAGE" \
            --dry-run=client \
            -o yaml > worker-job.yaml

          kubectl apply -f worker-job.yaml

          echo "Job deployed:"
          kubectl get jobs